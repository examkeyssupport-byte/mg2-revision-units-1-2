<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Goal 2 · Revision · Units 1 &amp; 2</title>
<style>
/* One interactive page laid out like the two paper worksheets: blue-framed Grammar and Vocabulary boxes per unit.
   Circle / underline questions are taps; every written question is a typed answer, as on paper. */
:root{--blue:#1e88e5;--dk:#0d47a1;--ink:#1c1c1c;--ok:#1a9c50;--okbg:#d9f7e4;--bad:#d4001a;--badbg:#ffe0e3;--ans:#1a3fd0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#e8eef5;color:var(--ink);font:17px/1.45 Calibri,"Segoe UI",system-ui,sans-serif}
.sheet{max-width:900px;margin:0 auto;background:#fff;min-height:100vh;padding:10px 10px 0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--dk);outline-offset:1px}
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:8px}
.tabs{display:flex;gap:6px}
.tab{border:2px solid var(--blue);background:#fff;color:var(--dk);font-weight:700;border-radius:10px;padding:8px 16px;min-height:44px}
.tab.on{background:var(--blue);color:#fff}
.top label{font-size:.95rem}
.top input{border:0;border-bottom:2px dotted #555;width:170px;padding:2px 4px;background:transparent}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:4px 6px}
.title h1{margin:0;font:900 1.7rem/1.1 "Arial Black",Impact,sans-serif;color:#fff;-webkit-text-stroke:1.5px var(--blue);letter-spacing:1px;text-shadow:0 0 6px rgba(30,136,229,.5)}
.title span{font:900 1.15rem "Arial Black",Impact,sans-serif;color:var(--blue);transform:rotate(-4deg)}
.frame{border:3px solid var(--blue);padding:8px 12px 12px;margin-bottom:10px}
.frame>h2{margin:0 0 6px;text-align:center;font:italic 700 1.25rem Georgia,serif;color:var(--dk);text-decoration:underline}
.sec{margin-bottom:12px}
.sec h3{margin:0 0 6px;font-size:1.08rem;color:var(--blue);border-bottom:1.5px solid #bcdcff;display:inline-block;padding-right:10px}
.sec h3:before{content:"✏️ "}
.box{font-weight:700;margin-left:6px;color:var(--ink)}
.it{margin:0 0 8px;padding-left:4px}
.n{font-weight:700}
.note{color:var(--dk);font-weight:700;text-decoration:underline;font-size:.92rem;margin-left:8px;white-space:nowrap}
.ch{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle;margin:1px 3px}
.c{border:1.6px solid #9bb7d6;background:#fff;border-radius:999px;padding:3px 12px;min-height:36px;font-weight:700}
.c.pick{border-color:#0a7a3d;background:#eafff1;box-shadow:0 0 0 2px #0a7a3d inset}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important;color:#0b5c2e!important}
.bad{background:var(--badbg)!important;border-color:var(--bad)!important;color:#8f0012!important}
.fix{color:var(--ok);font-weight:700;font-size:.92rem;margin-left:6px}
.w{border:0;background:none;padding:2px 3px;border-radius:999px;min-height:34px}
.w.pick{box-shadow:0 0 0 2px #0a7a3d inset;background:#eafff1}
.in{color:var(--ans);font-weight:700;border:0;border-bottom:2px solid #555;border-radius:0;background:#f7fbff;padding:3px 6px;width:190px;max-width:100%;margin:0 4px;min-height:34px}
.in.long{display:block;width:calc(100% - 22px);margin:5px 0 0 18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
table{border-collapse:collapse;width:100%}
td,th{border:1.5px solid #555;padding:6px 8px}
th{background:#fde9d2}
td.k{width:30px;text-align:center;font-weight:700}
td.num{width:52px;padding:0}
.mi{width:100%;border:0;text-align:center;font-weight:800;color:var(--ans);min-height:38px;background:transparent;padding:0}
td.cl{padding:0}
td.cl .in{width:100%;margin:0;border-bottom:0;min-height:44px;text-align:center}
.pics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pic{text-align:center}
.pic img{width:100%;height:84px;object-fit:contain}
.pic .ch{display:flex;flex-direction:column;align-items:stretch;margin:2px 0 0}
.foot{position:sticky;bottom:0;background:#fff;border-top:3px solid var(--blue);padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin:0 -10px}
.big{font-weight:700;border:0;border-radius:12px;padding:10px 18px;background:var(--blue);color:#fff;min-height:46px}
.big.alt{background:#fff;color:var(--ink);border:2px solid #555}
.score{font:800 1.25rem system-ui,sans-serif}
.score:empty{display:none}
@media (max-width:640px){
  body{font-size:16px}
  .pics{grid-template-columns:repeat(3,1fr)}
  .title h1{font-size:1.25rem}
  .big{padding:8px 12px;font-size:.92rem}
  .score{width:100%;text-align:center}
  .note{white-space:normal}
}
@media print{.foot,.tabs{display:none}body{background:#fff}}
</style>
</head>
<body>
<main class="sheet">
  <div class="top">
    <div class="tabs"><button class="tab" id="t0" type="button">Unit 1</button><button class="tab" id="t1" type="button">Unit 2</button></div>
    <label>Name: <input id="who" type="text" maxlength="30" autocomplete="off"></label>
  </div>
  <div class="title"><h1 id="ttl"></h1><span id="sub"></span></div>
  <div id="body"></div>
  <div class="foot"><span class="score" id="score" aria-live="polite"></span>
    <button class="big" id="check" type="button">Check my answers</button>
    <button class="big alt" id="show" type="button" hidden>Show the answers</button>
    <button class="big alt" id="again" type="button">Start again</button></div>
</main>

 ]},
 {title:"REVISION – UNIT (2)", sub:"Crime Doesn’t Pay", secs:[
  {g:"Grammar", h:"Choose the correct form in brackets", type:"choose", items:[
    C("The car was {} yesterday.",["break","broke","broken","breaking"],2), C("The window has been {}.",["close","closed","closing","been closed"],1),
    C("These books will {} at the weekend.",["publish","published","be published","been published"],2), C("When she arrived, the bus had already {}.",["leave","leaves","left","leaving"],2),
    C("He had been {} in Makkah for 5 years when he moved to Jeddah.",["live","lives","lived","living"],3), C("He {} to the cinema yesterday.",["go","went","gone","going"],1),
    C("I was {} TV when the phone rang.",["watch","watches","watched","watching"],3), C("It was raining hard when we {} the house.",["leave","leaves","leaving","left"],3),
    C("I used to {} late when I was a student.",["get up","gets up","getting up","got up"],0), C("My brother and I would {} to the park when we were children.",["go","goes","going","went"],0),
    C("Where did they {} last week?",["play","plays","played","playing"],0)]},
  {h:"Correct the errors in the following sentences", type:"type", items:[
    T("The lesson will <u>explain</u> by the teacher.",[["be explained"]]), T("He was tired because he <u>run</u> for 2 hours.",[["had been running"]]),
    T("After I <u>study</u>, I watched TV.",[["had studied"]]), T("They <u>be</u> here last night.",[["were"]]),
    T("Did you <u>used to</u> sleep well at night?",[["use to"]])]},
  {h:"Complete the following", type:"type", items:[
    T("He ( finish ) {} his work. Then, he ( go ) {} to bed.",[["finished"],["went"]],"“past simple”"),
    T("The car ( stole ) {}.",[["was stolen"]],"“passive form”")]},
  {h:"Do as shown between brackets", type:"type", items:[
    T("Sara has done the homework.",[["The homework has been done by Sara.","The homework has been done."]],"Change into passive",1),
    T("been / The store / reopened / has / .",[["The store has been reopened."]],"Unscramble the passive sentence",1),
    T("She cried. She lost her bag. → {} because {}",[["She cried"],["she had lost her bag"]],"Combine using the suitable past perfect form"),
    T("He used to travel to a new place every year.",[["He would travel to a new place every year."]],"Rewrite using “would” if possible",1)]},
  {g:"Vocabulary", h:"Circle the odd words", type:"choose", items:[
    C("{}",["grim","nabbed","robbed","stolen"],0), C("{}",["robber","thief","burglar","display"],3)]},
  {h:"Fill in the spaces with suitable word", box:"( display - pavement – sentenced – suspect )", type:"type", items:[
    T("My brother fell on the {} at the skateboard park and broke his wrist.",[["pavement"]]),
    T("The police are looking for the {}. He has dark hair and was wearing a green shirt.",[["suspect"]]),
    T("The department store has a beautiful vacation {} in their window.",[["display"]])]},
  {h:"Match", type:"matches", sets:[
    {h:"Match the words with the meanings", left:["nabbed","decline","misdemeanor","inmate"], right:[["to refuse",2],["caught - arrested",1],["a minor crime",3],["a prisoner",4]]},
    {h:"Match the words with the opposites", left:["unauthorized","victim","suspect","grim"], right:[["criminal",2],["authorized",1],["glad - pleased",4],["innocent",3]]}]},
  {h:"Underline the correct word for each picture", type:"pics", items:[
    {img:"u2p0",o:["Policeman","robber"],a:1},{img:"u2p1",o:["display","blunder"],a:0},{img:"u2p2",o:["fraud","swarm"],a:1},{img:"u2p3",o:["inmate","pavement"],a:0},{img:"u2p4",o:["pickpocket","prisoner"],a:0}]}
 ]}
];

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; };
const btn = (cls, html, fn) => { const b = el("button", cls, html); b.type = "button"; b.onclick = fn; return b; };
const kind = (s, it) => s.type==="mixed" ? it.k : s.type;
const blanks = it => Math.max(1, (it.t.match(/\{\}/g)||[]).length);
// typed answers: capitals, extra spaces, final punctuation and curly/straight apostrophes do not matter
const norm = x => String(x ?? "").toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim();
const typedOK = (it, v) => it.a.every((alts,k) => alts.some(x => norm(x)===norm(v[k])));
const setOK = (col, v) => { const got = norm(v).split(/[^a-z0-9']+/).filter(Boolean).sort().join("|"); return got === col.a.map(norm).sort().join("|"); };
function fresh(u){ return UNITS[u].secs.map(s => s.type==="classify" ? s.cols.map(()=>"") : s.type==="matches" ? s.sets.map(m=>m.right.map(()=>"")) : s.items.map(it => kind(s,it)==="type" ? Array(blanks(it)).fill("") : null)); }
let cur = 0, st = [fresh(0), fresh(1)], chk = [false,false], shown = [false,false];
const touch = () => { if(chk[cur]){ chk[cur] = false; shown[cur] = false; } draw(); };
function field(cls, value, onval){
  const i = el("input", cls); i.type = "text"; i.value = value; i.autocomplete = "off"; i.autocapitalize = "off"; i.spellcheck = false;
  i.oninput = () => { onval(i.value); i.classList.remove("ok","bad"); }; return i;
}

/* ---------- item renderers: each returns [node, isCorrect] ---------- */
function rChoose(it, v, set, n){
  const d = el("div","it"), parts = it.t.split("{}"), good = v===it.a, C_ = chk[cur];
  d.append(el("span","n", n+"- "), document.createTextNode(parts[0]));
  const ch = el("span","ch");
  it.o.forEach((o,k)=>{ const b = btn("c"+(v===k?" pick":""), o, ()=>set(k)); if(C_ && v===k) b.classList.add(good?"ok":"bad"); if(C_ && shown[cur] && !good && k===it.a) b.classList.add("ok"); ch.append(b); });
  d.append(ch, document.createTextNode(parts[1]||""));
  if(it.note) d.append(el("span","note","( "+it.note+" )"));
  return [d, good];
}
function rTap(it, v, set, n){
  const d = el("div","it"), good = v===it.a, C_ = chk[cur];
  d.append(el("span","n", n+"- "));
  it.s.split(" ").forEach((w,k)=>{ const b = btn("w"+(v===k?" pick":""), w, ()=>set(k)); if(C_ && v===k) b.classList.add(good?"ok":"bad"); if(C_ && shown[cur] && !good && k===it.a) b.classList.add("ok"); d.append(b, document.createTextNode(" ")); });
  d.append(el("span","note","( "+it.note+" )")); return [d, good];
}
function rType(it, v, set, n){
  const d = el("div","it"), parts = it.t.split("{}"), good = typedOK(it, v), C_ = chk[cur];
  const inp = k => { const f = field("in"+(it.long?" long":""), v[k], x => { v[k] = x; }); f.setAttribute("aria-label","answer "+n);
    if(C_) f.classList.add(it.a[k].some(x=>norm(x)===norm(v[k])) ? "ok" : "bad"); return f; };
  d.append(el("span","n", n+"- "));
  if(parts.length===1){
    d.append(el("span",null,it.t)); if(it.note) d.append(el("span","note","( "+it.note+" )")); d.append(inp(0));
  } else {
    parts.forEach((p,k)=>{ d.append(el("span",null,p)); if(k<parts.length-1) d.append(inp(k)); });
    if(it.note) d.append(el("span","note","( "+it.note+" )"));
  }
  if(C_ && shown[cur] && !good) d.append(el("div","fix", it.a.map(x=>x[0]).join("  …  ")));
  return [d, good];
}
const R = {choose:rChoose, tap:rTap, type:rType};

/* ---------- page ---------- */
function draw(){
  const U = UNITS[cur], S = st[cur], C_ = chk[cur], body = $("body"); let right = 0, total = 0, frame = null;
  $("t0").className = "tab"+(cur===0?" on":""); $("t1").className = "tab"+(cur===1?" on":"");
  $("ttl").textContent = U.title; $("sub").textContent = U.sub; body.innerHTML = "";
  U.secs.forEach((s,si)=>{
    if(s.g){ frame = el("section","frame"); frame.append(el("h2",null,s.g)); body.append(frame); }
    const sec = el("div","sec"); sec.append(el("h3",null,s.h)); if(s.box) sec.append(el("span","box",s.box)); frame.append(sec);
    if(s.type==="classify"){
      const tb = el("table"), hr = el("tr"), tr = el("tr");
      s.cols.forEach((c,ci)=>{ hr.append(el("th",null,c.h)); const td = el("td","cl"), good = setOK(c, S[si][ci]); total++; if(good) right++;
        const f = field("in", S[si][ci], x => { S[si][ci] = x; }); f.setAttribute("aria-label", c.h); if(C_) f.classList.add(good?"ok":"bad");
        td.append(f); if(C_ && shown[cur] && !good) td.append(el("div","fix", c.a.join(" - "))); tr.append(td); });
      tb.append(hr, tr); sec.append(tb);
    } else if(s.type==="matches"){
      const g = el("div","grid3");
      s.sets.forEach((m,mi)=>{ const M = S[si][mi], box = el("div"); box.append(el("div","n",m.h));
        const tb = el("table");
        m.right.forEach(([txt, ans], r)=>{ const tr = el("tr"), good = String(M[r]).trim()===String(ans); total++; if(good) right++;
          const num = el("td","num"), f = field("mi", M[r], x => { M[r] = x; }); f.maxLength = 1; f.inputMode = "numeric"; f.setAttribute("aria-label","number for "+txt);
          if(C_) f.classList.add(good?"ok":"bad"); num.append(f);
          if(C_ && shown[cur] && !good){ const fx = el("div","fix", ans); fx.style.margin = "0"; fx.style.textAlign = "center"; num.append(fx); }
          tr.append(el("td","k", r<m.left.length ? r+1 : ""), el("td",null, m.left[r] ?? ""), num, el("td",null,txt)); tb.append(tr); });
        box.append(tb); g.append(box); });
      sec.append(g);
    } else if(s.type==="pics"){
      const g = el("div","pics");
      s.items.forEach((it,i)=>{ const d = el("div","pic"), im = el("img"); im.src = IMG[it.img]; im.alt = ""; const v = S[si][i], good = v===it.a; total++; if(good) right++;
        const ch = el("div","ch");
        it.o.forEach((o,k)=>{ const b = btn("c"+(v===k?" pick":""), o, ()=>{ S[si][i] = k; touch(); }); if(C_ && v===k) b.classList.add(good?"ok":"bad"); if(C_ && shown[cur] && !good && k===it.a) b.classList.add("ok"); ch.append(b); });
        d.append(im, ch); g.append(d); });
      sec.append(g);
    } else {
      s.items.forEach((it,i)=>{
        const [node, good] = R[kind(s,it)](it, S[si][i], v=>{ S[si][i] = v; touch(); }, i+1); total++; if(good) right++; sec.append(node); });
    }
  });
  const sc = $("score");
  sc.textContent = C_ ? `${right} / ${total}` + (right===total ? "  ★ Excellent!" : right>=total*.75 ? "  Very good!" : "  Try again!") : "";
  sc.style.color = C_ && right===total ? "var(--ok)" : "";
  $("show").hidden = !C_ || right===total;
}
$("t0").onclick = () => { cur = 0; draw(); scrollTo(0,0); };
$("t1").onclick = () => { cur = 1; draw(); scrollTo(0,0); };
$("check").onclick = () => { chk[cur] = true; shown[cur] = false; draw(); };
$("show").onclick = () => { shown[cur] = true; draw(); };
$("again").onclick = () => { st[cur] = fresh(cur); chk[cur] = false; shown[cur] = false; draw(); scrollTo({top:0,behavior:"smooth"}); };
draw();
</script>
</body>
</html>
